<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centre Médical du Châtaignier - Pointage</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    h1 { font-size: 1.25rem; text-align: center; text-transform: uppercase; margin: 0 0 16px 0; letter-spacing: 0.5px; }
    .timer-banner { background: #fef9c3; color: #854d0e; font-weight: 600; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; }
    .section-title { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .btn { border: 2px solid #e2e8f0; background: white; border-radius: 12px; padding: 14px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .btn.selected { border-color: #2563eb; background: #eff6ff; color: #2563eb; }
    .btn-in { background: #bef264; color: #365314; border: none; }
    .btn-in:hover { background: #a3e635; }
    .btn-out { background: #fca5a5; color: #7f1d1d; border: none; }
    .btn-out:hover { background: #f87171; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-csv { background: #0f172a; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    ul.history-list { list-style: none; padding: 0; margin: 0; background: #f8fafc; border-radius: 12px; padding: 8px 12px; min-height: 50px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
    .history-item:last-child { border-bottom: none; }
    .badge { font-weight: 700; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
    .badge-in { background: #d9f99d; color: #365314; }
    .badge-out { background: #fecaca; color: #7f1d1d; }
  </style>
</head>
<body>

<div class="card">
  <h1>Centre Médical<br>du Châtaignier</h1>
  
  <div class="timer-banner">
    ⏱️ Temps restant pour valider : <span id="timer">15</span>s
  </div>

  <div class="section-title">1. Choisir le collaborateur</div>
  <div class="grid-2">
    <button class="btn btn-user" onclick="selectUser('Julie', this)">Julie</button>
    <button class="btn btn-user" onclick="selectUser('Vincent', this)">Vincent</button>
  </div>

  <div class="section-title">2. Action</div>
  <div class="grid-2">
    <button class="btn btn-in" onclick="sendPointage('ENTRÉE')">ENTRÉE</button>
    <button class="btn btn-out" onclick="sendPointage('SORTIE')">SORTIE</button>
  </div>

  <div class="history-header">
    <span class="section-title" style="margin:0;">Derniers pointages</span>
    <button class="btn-csv" onclick="exportToCSV()">Télécharger CSV</button>
  </div>

  <ul id="historyList" class="history-list">
    <!-- Chargé dynamiquement -->
  </ul>
</div>

<script>
  const SCRIPT_URL = 'VOTRE_URL_GOOGLE_APPS_SCRIPT_ICI';

  let selectedUser = null;
  let timeLeft = 15;
  let timerInterval = null;

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 15;
    document.getElementById('timer').textContent = timeLeft;
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
      }
    }, 1000);
  }

  function selectUser(user, btnElement) {
    selectedUser = user;
    document.querySelectorAll('.btn-user').forEach(b => b.classList.remove('selected'));
    btnElement.classList.add('selected');
  }

  function sendPointage(action) {
    if (!selectedUser) {
      alert('Veuillez d\'abord sélectionner un collaborateur.');
      return;
    }

    const data = { user: selectedUser, action: action };
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(() => {
      alert(`Pointage ${action} enregistré pour ${selectedUser}`);
      selectedUser = null;
      document.querySelectorAll('.btn-user').forEach(b => b.classList.remove('selected'));
      renderHistory();
      startTimer();
    })
    .catch(err => console.error('Erreur:', err));
  }

  // Extraction directe des chaînes pour découper proprement YYYY-MM-DD et HH:mm sans passer par new Date()
  function formatDate(str) {
    if (!str) return '';
    if (typeof str === 'string' && str.includes('T')) {
      const datePart = str.split('T')[0];
      const parts = datePart.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
    }
    return str;
  }

  function formatTime(str) {
    if (!str) return '';
    if (typeof str === 'string' && str.includes('T')) {
      const timePart = str.split('T')[1];
      if (timePart) {
        const parts = timePart.split(':');
        if (parts.length >= 2) {
          return `${parts[0]}:${parts[1]}`;
        }
      }
    }
    return str;
  }

  function renderHistory() {
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(logs => {
        const list = document.getElementById('historyList');
        if (!logs || logs.length === 0) {
          list.innerHTML = '<li class="history-item">Aucun pointage.</li>';
          return;
        }
        list.innerHTML = logs.slice(0, 10).map(log => {
          const formattedDate = formatDate(log.date);
          const formattedTime = formatTime(log.time);
          
          return `
            <li class="history-item">
              <span><strong>${log.user}</strong> (${formattedDate} ${formattedTime})</span>
              <span class="badge ${log.action === 'ENTRÉE' ? 'badge-in' : 'badge-out'}">${log.action}</span>
            </li>
          `;
        }).join('');
      })
      .catch(err => console.error('Erreur lors du chargement de l\'historique:', err));
  }

  function exportToCSV() {
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(logs => {
        if (!logs || logs.length === 0) return alert('Aucune donnée à exporter.');
        let csvContent = "\uFEFFDate;Heure;Collaborateur;Action\n";
        logs.forEach(l => {
          csvContent += `${formatDate(l.date)};${formatTime(l.time)};${l.user};${l.action}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Pointages_Chataignier_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
      });
  }

  startTimer();
  renderHistory();
</script>

</body>
</html>
