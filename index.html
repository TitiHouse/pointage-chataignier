<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pointage - Centre Médical du Châtaignier</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* En-tête et Logo (sans cercle) */
    .header {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo {
      max-width: 150px;
      height: auto;
      border-radius: 0; /* Pas de cercle */
      border: none;
      box-shadow: none;
      display: block;
      margin: 0 auto 12px auto;
      object-fit: contain;
    }

    .header h1 {
      font-size: 1.25rem;
      color: #0f766e;
      font-weight: 700;
    }

    .header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 2px;
    }

    /* Bannière Minuteur */
    .timer-banner {
      background-color: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.3s ease;
    }

    .timer-banner.expired {
      background-color: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }

    /* Alertes */
    .alert {
      display: none;
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      text-align: center;
      font-weight: 600;
    }

    /* Sections */
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* Grille de boutons utilisateurs */
    .user-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-user {
      background-color: #f8fafc;
      border: 2px solid #cbd5e1;
      color: #334155;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-user:active {
      transform: scale(0.98);
    }

    .btn-user.selected {
      background-color: #0f766e;
      border-color: #0f766e;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    /* Grille d'actions (Entrée / Sortie) */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-action {
      padding: 16px 10px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      color: #ffffff;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .btn-action.ready {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-in {
      background-color: #16a34a;
    }

    .btn-out {
      background-color: #dc2626;
    }

    /* Historique */
    .history-container {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      font-size: 0.85rem;
    }

    .history-date {
      font-size: 0.75rem;
      color: #64748b;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-in {
      background-color: #dcfce7;
      color: #15803d;
    }

    .badge-out {
      background-color: #fee2e2;
      color: #b91c1c;
    }

    .loading, .empty {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      padding: 10px;
    }

    /* Bouton Export */
    .btn-export {
      background: none;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-export:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- En-tête avec logo sans cercle -->
    <div class="header">
      <img src="Chataignier.png" alt="Logo Centre Médical du Châtaignier" class="logo">
      <h1>Centre Médical du Châtaignier</h1>
      <p>Système de pointage quotidien</p>
    </div>

    <!-- Bannière Minuteur -->
    <div id="timerBanner" class="timer-banner">
      ⏱️ Session active : <strong id="countdown">60</strong>s restantes
    </div>

    <!-- Alertes -->
    <div id="alertMsg" class="alert"></div>

    <!-- Étape 1 : Sélection du collaborateur -->
    <div>
      <div class="section-title">1. Sélectionner votre nom</div>
      <div class="user-grid">
        <button class="btn-user" onclick="selectUser('Julie', this)">Julie</button>
        <button class="btn-user" onclick="selectUser('Vincent', this)">Vincent</button>
      </div>
    </div>

    <!-- Étape 2 : Action -->
    <div>
      <div class="section-title">2. Enregistrer l'action</div>
      <div class="action-grid">
        <button id="btnIn" class="btn-action btn-in" onclick="record('ENTRÉE')">ENTRÉE</button>
        <button id="btnOut" class="btn-action btn-out" onclick="record('SORTIE')">SORTIE</button>
      </div>
    </div>

    <!-- Historique partagé -->
    <div>
      <div class="section-title">Derniers pointages enregistrés</div>
      <div class="history-container">
        <ul id="historyList" class="history-list">
          <li class="loading">Chargement de l'historique...</li>
        </ul>
      </div>
    </div>

    <!-- Exportation CSV -->
    <button class="btn-export" onclick="exportToCSV()">📥 Exporter les données (CSV)</button>
  </div>

  <script>
    // URL Google Apps Script de centralisation
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuC4zNdsejh4BLSTlGoEyMizhfVylgUn8Fw2eVfS5U4ig6I6ssa8Yg4Fx31GAdsVwY/exec";

    let selectedUser = null;
    let timeLeft = 60;
    let timerInterval = null;

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 60;
      document.getElementById('countdown').innerText = timeLeft;
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('countdown').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          expireSession();
        }
      }, 1000);
    }

    function expireSession() {
      const banner = document.getElementById('timerBanner');
      banner.classList.add('expired');
      banner.innerHTML = "❌ <strong>Session expirée.</strong> Veuillez rescanner le QR Code.";
      
      document.querySelectorAll('.btn-user').forEach(btn => btn.disabled = true);
      document.getElementById('btnIn').classList.remove('ready');
      document.getElementById('btnOut').classList.remove('ready');
      resetSelection();
    }

    function selectUser(name, btnElement) {
      if (timeLeft <= 0) return;
      selectedUser = name;
      
      document.querySelectorAll('.btn-user').forEach(btn => {
        btn.classList.remove('selected');
      });
      if (btnElement) {
        btnElement.classList.add('selected');
      }
      
      document.getElementById('btnIn').classList.add('ready');
      document.getElementById('btnOut').classList.add('ready');
    }

    function record(action) {
      if (!selectedUser || timeLeft <= 0) return;

      const btnIn = document.getElementById('btnIn');
      const btnOut = document.getElementById('btnOut');
      btnIn.classList.remove('ready');
      btnOut.classList.remove('ready');

      const now = new Date();
      const dateStr = now.toLocaleDateString('fr-BE');
      const timeStr = now.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });

      showAlert("Enregistrement en cours...");

      const url = `${SCRIPT_URL}?user=${encodeURIComponent(selectedUser)}&action=${encodeURIComponent(action)}&date=${encodeURIComponent(dateStr)}&time=${encodeURIComponent(timeStr)}&t=${Date.now()}`;

      fetch(url)
        .then(() => {
          showAlert(`✅ Pointage enregistré : ${selectedUser} (${action}) à ${timeStr}`);
          renderHistory();
        })
        .catch(() => {
          showAlert(`✅ Pointage envoyé : ${selectedUser} (${action}) à ${timeStr}`);
          renderHistory();
        });

      clearInterval(timerInterval);
      document.getElementById('timerBanner').innerHTML = "✅ Pointage validé avec succès !";
      resetSelection();
    }

    function showAlert(msg) {
      const alert = document.getElementById('alertMsg');
      alert.innerText = msg;
      alert.style.display = 'block';
      setTimeout(() => { alert.style.display = 'none'; }, 4000);
    }

    function resetSelection() {
      selectedUser = null;
      document.querySelectorAll('.btn-user').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('btnIn').classList.remove('ready');
      document.getElementById('btnOut').classList.remove('ready');
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      
      fetch(`${SCRIPT_URL}?t=${Date.now()}`)
        .then(res => res.json())
        .then(logs => {
          if (!Array.isArray(logs) || logs.length === 0) {
            list.innerHTML = '<li class="empty">Aucun pointage enregistré.</li>';
            return;
          }
          list.innerHTML = logs.slice(0, 10).map(log => `
            <li class="history-item">
              <div>
                <strong>${escapeHtml(log.user)}</strong>
                <div class="history-date">${escapeHtml(log.date)} à ${escapeHtml(log.time)}</div>
              </div>
              <span class="badge ${log.action === 'ENTRÉE' ? 'badge-in' : 'badge-out'}">${escapeHtml(log.action)}</span>
            </li>
          `).join('');
        })
        .catch(() => {
          list.innerHTML = '<li class="empty">Impossible de charger l\'historique.</li>';
        });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function exportToCSV() {
      fetch(`${SCRIPT_URL}?t=${Date.now()}`)
        .then(res => res.json())
        .then(logs => {
          if (!Array.isArray(logs) || logs.length === 0) {
            alert('Aucune donnée à exporter.');
            return;
          }
          let csvContent = "\uFEFFDate;Heure;Collaborateur;Action\n";
          logs.forEach(l => {
            csvContent += `${l.date};${l.time};${l.user};${l.action}\n`;
          });
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Pointages_Chataignier_${new Date().toISOString().slice(0,10)}.csv`;
          a.click();
        })
        .catch(() => {
          alert('Erreur lors du téléchargement des données.');
        });
    }

    window.onload = function() {
      startTimer();
      renderHistory();
    };
  </script>
</body>
</html>
