  <style>
    :root {
      --primary-green: #8cdb29;
      --primary-dark: #6fae1b;
      --bg-dark: #0f172a;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #f8fafc;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;

    .header {
      background-color: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid var(--primary-green);
    }

    .logo-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 10px auto;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border: 3px solid var(--primary-green);
      overflow: hidden;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .header h1 {
      font-size: 1.15rem;
      color: #0f172a;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timer-banner {
      background-color: #fef3c7;
      color: #92400e;
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      border-bottom: 1px solid #fde68a;
    }

    .timer-banner.expired {
      background-color: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }

    .content {
      padding: 20px;
      flex: 1;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .collaborators {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn-user {
      padding: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-user.selected {
      border-color: var(--primary-green);
      background-color: rgba(140, 219, 41, 0.15);
      color: var(--primary-dark);
    }

    .btn-user:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn-action {
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .btn-action.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-in {
      background-color: var(--primary-green);
      color: #0f172a;
    }

    .btn-out {
      background-color: #ef4444;
    }

    .btn-action:disabled {
      opacity: 0.3 !important;
      pointer-events: none !important;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      background-color: #dcfce7;
      color: #15803d;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 20px;
      display: none;
    }

    .alert.error {
      background-color: #fee2e2;
      color: #b91c1c;
    }

    .alert.loading {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .history-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #e2e8f0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .export-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .history-list {
      max-height: 180px;
      overflow-y: auto;
      list-style: none;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
    }

    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-in {
      background-color: rgba(140, 219, 41, 0.2);
      color: var(--primary-dark);
    }

    .badge-out {
      background-color: #fee2e2;
      color: #dc2626;
    }
  </style>

</head>

<script>

  // URL Google Apps Script de centralisation
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbytk4zzP4T6Z0_Mwuf6Wt_J0U6fMLKQD2_U75nF1HDUnFUhGwKsI9_ZfVckpPbKl3flvQ/exec";


  let selectedUser = null;
  let timeLeft = 60;
  let timerInterval = null;

  // Indique si un pointage est actuellement en cours d'envoi
  let isRecording = false;


  /*
   * Démarrage du compte à rebours
   */
  function startTimer() {

    timerInterval = setInterval(() => {

      timeLeft--;

      document.getElementById('countdown').innerText = timeLeft;

      if (timeLeft <= 0) {

        clearInterval(timerInterval);

        expireSession();

      }

    }, 1000);
  }


  /*
   * Expiration de la session
   */
  function expireSession() {

    const banner =
      document.getElementById('timerBanner');

    banner.classList.add('expired');

    banner.innerHTML =
      "❌ <strong>Session expirée.</strong> Veuillez rescanner le QR Code.";

    document
      .querySelectorAll('.btn-user')
      .forEach(btn => btn.disabled = true);

    document.getElementById('btnIn').disabled = true;
    document.getElementById('btnOut').disabled = true;

    resetSelection();
  }


  /*
   * Sélection d'un collaborateur
   */
  function selectUser(name) {

    // Impossible de sélectionner quelqu'un
    // si le temps est écoulé ou si un pointage est en cours
    if (timeLeft <= 0 || isRecording) {
      return;
    }

    selectedUser = name;

    document
      .querySelectorAll('.btn-user')
      .forEach(btn => {

        btn.classList.toggle(
          'selected',
          btn.innerText === name
        );

      });

    document
      .getElementById('btnIn')
      .classList.add('active');

    document
      .getElementById('btnOut')
      .classList.add('active');
  }


  /*
   * Enregistrement du pointage
   */
  async function record(action) {

    // Vérifications avant d'envoyer le pointage
    if (!selectedUser || timeLeft <= 0 || isRecording) {
      return;
    }

    // On bloque immédiatement les boutons
    // pour empêcher les doubles clics
    isRecording = true;

    const btnIn =
      document.getElementById('btnIn');

    const btnOut =
      document.getElementById('btnOut');

    btnIn.disabled = true;
    btnOut.disabled = true;


    const now = new Date();

    const dateStr =
      now.toLocaleDateString('fr-BE');

    const timeStr =
      now.toLocaleTimeString(
        'fr-BE',
        {
          hour: '2-digit',
          minute: '2-digit'
        }
      );


    // Message indiquant que l'application travaille
    showAlert(
      "⏳ Enregistrement du pointage en cours...",
      "loading"
    );


    /*
     * Construction de l'URL
     */
    const url =
      `${SCRIPT_URL}` +
      `?user=${encodeURIComponent(selectedUser)}` +
      `&action=${encodeURIComponent(action)}` +
      `&date=${encodeURIComponent(dateStr)}` +
      `&time=${encodeURIComponent(timeStr)}`;


    try {

      /*
       * On ATTEND réellement la réponse de Google.
       *
       * C'est ici la grosse différence avec
       * l'ancien code.
       */
      const response = await fetch(url);


      /*
       * fetch() peut réussir au niveau réseau
       * même si le serveur répond avec une erreur HTTP.
       *
       * On vérifie donc response.ok.
       */
      if (!response.ok) {

        throw new Error(
          `Erreur serveur (${response.status})`
        );
      }


      /*
       * Si Google Apps Script renvoie du JSON,
       * on essaie de le lire.
       *
       * Si ce n'est pas du JSON, ce n'est pas forcément
       * une erreur : certains Apps Script peuvent répondre
       * avec du texte.
       */
      let serverData = null;

      try {

        serverData = await response.json();

      } catch (jsonError) {

        // Réponse non JSON :
        // on considère quand même la requête HTTP
        // comme réussie si response.ok === true.

      }


      /*
       * À partir d'ici seulement,
       * on considère le pointage comme envoyé.
       */
      showAlert(
        `✅ Pointage enregistré : ${selectedUser} (${action}) à ${timeStr}`,
        "success"
      );


      /*
       * Le pointage étant confirmé par la réponse HTTP,
       * on arrête le compteur.
       */
      clearInterval(timerInterval);

      document
        .getElementById('timerBanner')
        .innerHTML =
        "✅ Pointage validé avec succès !";


      /*
       * On recharge l'historique.
       */
      renderHistory();


      /*
       * On réinitialise la sélection.
       */
      resetSelection();


    } catch (error) {

      /*
       * Une erreur est survenue :
       *
       * - pas d'Internet
       * - Google Apps Script inaccessible
       * - erreur serveur
       * - problème réseau
       *
       * On NE dit surtout pas que le pointage
       * a été enregistré.
       */

      console.error(
        "Erreur lors de l'enregistrement du pointage :",
        error
      );


      showAlert(
        "❌ Impossible d'enregistrer le pointage. Vérifiez votre connexion et réessayez.",
        "error"
      );


      /*
       * On remet les boutons dans leur état normal
       * afin que l'utilisateur puisse réessayer.
       */
      btnIn.disabled = false;
      btnOut.disabled = false;

      isRecording = false;

      return;
    }


    /*
     * Le pointage a été traité correctement.
     */
    isRecording = false;

  }


  /*
   * Affichage d'un message
   */
  function showAlert(msg, type = "success") {

    const alert =
      document.getElementById('alertMsg');

    alert.innerText = msg;

    alert.className = "alert";

    if (type === "error") {
      alert.classList.add("error");
    }

    if (type === "loading") {
      alert.classList.add("loading");
    }

    alert.style.display = 'block';


    /*
     * Les messages d'erreur et de chargement
     * restent affichés.
     *
     * Les messages de succès disparaissent
     * automatiquement après 4 secondes.
     */
    if (type === "success") {

      setTimeout(() => {

        alert.style.display = 'none';

      }, 4000);

    }

  }


  /*
   * Réinitialisation de la sélection
   */
  function resetSelection() {

    selectedUser = null;

    document
      .querySelectorAll('.btn-user')
      .forEach(btn =>
        btn.classList.remove('selected')
      );

    document
      .getElementById('btnIn')
      .classList.remove('active');

    document
      .getElementById('btnOut')
      .classList.remove('active');

  }


  /*
   * Affichage de l'historique
   */
  async function renderHistory() {

    const list =
      document.getElementById('historyList');


    try {

      const response =
        await fetch(SCRIPT_URL);


      if (!response.ok) {

        throw new Error(
          `Erreur serveur (${response.status})`
        );

      }


      const logs =
        await response.json();


      list.innerHTML =
        logs.slice(0, 10).map(log => `

          <li class="history-item">

            <span>
              <strong>${log.user}</strong>
              (${log.date} ${log.time})
            </span>

            <span class="badge ${
              log.action === 'ENTRÉE'
                ? 'badge-in'
                : 'badge-out'
            }">
              ${log.action}
            </span>

          </li>

        `).join('');


    } catch (error) {

      console.error(
        "Erreur lors du chargement de l'historique :",
        error
      );

      list.innerHTML = `
        <li class="history-item">
          <span>
            Impossible de charger l'historique.
          </span>
        </li>
      `;

    }

  }


  /*
   * Export CSV
   */
  async function exportToCSV() {

    try {

      const response =
        await fetch(SCRIPT_URL);


      if (!response.ok) {

        throw new Error(
          `Erreur serveur (${response.status})`
        );

      }


      const logs =
        await response.json();


      if (logs.length === 0) {

        alert(
          'Aucune donnée à exporter.'
        );

        return;
      }


      let csvContent =
        "\uFEFFDate;Heure;Collaborateur;Action\n";


      logs.forEach(l => {

        csvContent +=
          `${l.date};${l.time};${l.user};${l.action}\n`;

      });


      const blob =
        new Blob(
          [csvContent],
          {
            type: 'text/csv;charset=utf-8;'
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement('a');

      a.href = url;

      a.download =
        `Pointages_Chataignier_${
          new Date()
            .toISOString()
            .slice(0,10)
        }.csv`;


      a.click();


      /*
       * Nettoyage de l'URL temporaire.
       */
      URL.revokeObjectURL(url);


    } catch (error) {

      console.error(
        "Erreur lors de l'export CSV :",
        error
      );

      alert(
        "❌ Impossible de télécharger les pointages. Vérifiez votre connexion et réessayez."
      );

    }

  }


  /*
   * Démarrage de l'application
   */
  startTimer();

  renderHistory();

</script>
