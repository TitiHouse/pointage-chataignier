```html
<script>

  // =========================================================
  // CONFIGURATION
  // =========================================================

  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwHK7uZo6Tx485XSMn-m9CYNuRnHBjryDcdcKb0CHGtKaEibbCCmJKrqr4jLmzSMObbQQ/exec";

  const REQUEST_TIMEOUT = 10000; // 10 secondes

  let selectedUser = null;
  let timeLeft = 60;
  let timerInterval = null;
  let isRecording = false;

  // Évite de recharger plusieurs fois la page
  let isReloading = false;


  // =========================================================
  // URL GOOGLE APPS SCRIPT SANS CACHE
  // =========================================================

  function getScriptUrl(parameters = {}) {

    const url = new URL(SCRIPT_URL);

    Object.keys(parameters).forEach(key => {
      url.searchParams.set(key, parameters[key]);
    });

    // Anti-cache
    url.searchParams.set("_t", Date.now());

    return url.toString();
  }


  // =========================================================
  // FETCH AVEC TIMEOUT
  // =========================================================

  async function fetchWithTimeout(url, options = {}) {

    const controller = new AbortController();

    const timeout = setTimeout(() => {
      controller.abort();
    }, REQUEST_TIMEOUT);

    try {

      const response = await fetch(url, {
        ...options,

        // Très important :
        // demande au navigateur de ne pas utiliser son cache.
        cache: "no-store",

        signal: controller.signal
      });

      return response;

    } finally {

      clearTimeout(timeout);

    }
  }


  // =========================================================
  // DÉTECTION DE LA CONNEXION
  // =========================================================

  window.addEventListener("offline", () => {

    console.log("Connexion Internet perdue.");

    showAlert(
      "⚠️ Connexion Internet perdue. En attente du retour du réseau...",
      "error"
    );

  });


  window.addEventListener("online", () => {

    console.log("Connexion Internet rétablie.");

    showAlert(
      "🌐 Connexion rétablie. Rechargement de l'application...",
      "loading"
    );

    /*
     * Petit délai pour laisser au navigateur
     * le temps de réellement retrouver Internet.
     */
    setTimeout(() => {

      if (!isReloading) {

        isReloading = true;

        /*
         * On force une nouvelle URL avec un timestamp.
         * Cela évite que le navigateur ressorte
         * une ancienne version de la page.
         */
        const url = new URL(window.location.href);

        url.searchParams.set("_reload", Date.now());

        window.location.replace(url.toString());

      }

    }, 1000);

  });


  // =========================================================
  // COMPTE À REBOURS
  // =========================================================

  function startTimer() {

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {

      timeLeft--;

      document.getElementById("countdown").innerText = timeLeft;

      if (timeLeft <= 0) {

        clearInterval(timerInterval);

        expireSession();

      }

    }, 1000);

  }


  // =========================================================
  // EXPIRATION
  // =========================================================

  function expireSession() {

    const banner =
      document.getElementById("timerBanner");

    banner.classList.add("expired");

    banner.innerHTML =
      "❌ <strong>Session expirée.</strong> Veuillez rescanner le QR Code.";

    document
      .querySelectorAll(".btn-user")
      .forEach(btn => btn.disabled = true);

    document.getElementById("btnIn").disabled = true;
    document.getElementById("btnOut").disabled = true;

    resetSelection();

  }


  // =========================================================
  // SÉLECTION COLLABORATEUR
  // =========================================================

  function selectUser(name) {

    if (timeLeft <= 0 || isRecording) {
      return;
    }

    selectedUser = name;

    document
      .querySelectorAll(".btn-user")
      .forEach(btn => {

        btn.classList.toggle(
          "selected",
          btn.innerText.trim() === name
        );

      });

    document
      .getElementById("btnIn")
      .classList.add("active");

    document
      .getElementById("btnOut")
      .classList.add("active");

  }


  // =========================================================
  // ENREGISTREMENT DU POINTAGE
  // =========================================================

  async function record(action) {

    if (!selectedUser || timeLeft <= 0 || isRecording) {
      return;
    }

    // Si le navigateur sait déjà qu'il est hors ligne
    if (!navigator.onLine) {

      showAlert(
        "❌ Aucune connexion Internet. Veuillez attendre le retour du réseau.",
        "error"
      );

      return;
    }

    isRecording = true;

    const btnIn =
      document.getElementById("btnIn");

    const btnOut =
      document.getElementById("btnOut");

    btnIn.disabled = true;
    btnOut.disabled = true;


    const userAtStart = selectedUser;

    const now = new Date();

    const dateStr =
      now.toLocaleDateString("fr-BE");

    const timeStr =
      now.toLocaleTimeString(
        "fr-BE",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


    showAlert(
      "⏳ Enregistrement du pointage en cours...",
      "loading"
    );


    // =======================================================
    // CONSTRUCTION URL
    // =======================================================

    const url = getScriptUrl({

      user: userAtStart,
      action: action,
      date: dateStr,
      time: timeStr

    });


    console.log("Envoi du pointage :", url);


    try {

      // =====================================================
      // APPEL GOOGLE APPS SCRIPT
      // =====================================================

      const response =
        await fetchWithTimeout(url);


      console.log(
        "Réponse Google Apps Script :",
        response.status
      );


      if (!response.ok) {

        throw new Error(
          `Erreur HTTP ${response.status}`
        );

      }


      // =====================================================
      // LECTURE DE LA RÉPONSE
      // =====================================================

      let serverData = null;

      try {

        serverData = await response.json();

        console.log(
          "Réponse serveur :",
          serverData
        );

      } catch (jsonError) {

        /*
         * Certaines réponses Apps Script peuvent
         * ne pas être interprétées comme JSON.
         *
         * Si HTTP = 200, on continue.
         */

        console.warn(
          "Réponse non JSON reçue."
        );

      }


      /*
       * IMPORTANT :
       *
       * Si Apps Script nous renvoie explicitement
       * status = error, on considère que le pointage
       * n'a PAS été enregistré.
       */

      if (
        serverData &&
        serverData.status === "error"
      ) {

        throw new Error(
          serverData.message ||
          "Le serveur a refusé le pointage."
        );

      }


      // =====================================================
      // SUCCÈS
      // =====================================================

      showAlert(
        `✅ Pointage enregistré : ${userAtStart} (${action}) à ${timeStr}`,
        "success"
      );


      clearInterval(timerInterval);


      document
        .getElementById("timerBanner")
        .classList.remove("expired");


      document
        .getElementById("timerBanner")
        .innerHTML =
        "✅ Pointage validé avec succès !";


      // Recharge l'historique
      renderHistory();


      // Réinitialise la sélection
      resetSelection();


      isRecording = false;


    } catch (error) {

      console.error(
        "Erreur lors de l'enregistrement :",
        error
      );


      let message =
        "❌ Impossible d'enregistrer le pointage.";


      if (error.name === "AbortError") {

        message =
          "❌ Le serveur ne répond pas. Vérifiez votre connexion et réessayez.";

      } else if (!navigator.onLine) {

        message =
          "❌ Connexion Internet perdue. Attendez le retour du réseau puis réessayez.";

      }


      showAlert(
        message,
        "error"
      );


      /*
       * Très important :
       * on libère TOUJOURS le verrou.
       */

      isRecording = false;

      btnIn.disabled = false;
      btnOut.disabled = false;

    }

  }


  // =========================================================
  // MESSAGE
  // =========================================================

  function showAlert(msg, type = "success") {

    const alert =
      document.getElementById("alertMsg");

    alert.innerText = msg;

    alert.className = "alert";

    if (type === "error") {
      alert.classList.add("error");
    }

    if (type === "loading") {
      alert.classList.add("loading");
    }

    alert.style.display = "block";


    if (type === "success") {

      setTimeout(() => {

        alert.style.display = "none";

      }, 4000);

    }

  }


  // =========================================================
  // RESET
  // =========================================================

  function resetSelection() {

    selectedUser = null;

    document
      .querySelectorAll(".btn-user")
      .forEach(btn => {

        btn.classList.remove("selected");

      });

    document
      .getElementById("btnIn")
      .classList.remove("active");

    document
      .getElementById("btnOut")
      .classList.remove("active");

  }


  // =========================================================
  // HISTORIQUE
  // =========================================================

  async function renderHistory() {

    const list =
      document.getElementById("historyList");


    try {

      const url =
        getScriptUrl();


      const response =
        await fetchWithTimeout(url);


      if (!response.ok) {

        throw new Error(
          `Erreur HTTP ${response.status}`
        );

      }


      const logs =
        await response.json();


      list.innerHTML =
        logs.slice(0, 10).map(log => `

          <li class="history-item">

            <span>
              <strong>${escapeHtml(log.user)}</strong>
              (${escapeHtml(log.date)} ${escapeHtml(log.time)})
            </span>

            <span class="badge ${
              log.action === "ENTRÉE"
                ? "badge-in"
                : "badge-out"
            }">
              ${escapeHtml(log.action)}
            </span>

          </li>

        `).join("");


    } catch (error) {

      console.error(
        "Erreur lors du chargement de l'historique :",
        error
      );

      list.innerHTML = `
        <li class="history-item">
          <span>
            Impossible de charger l'historique.
          </span>
        </li>
      `;

    }

  }


  // =========================================================
  // PROTECTION HTML
  // =========================================================

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =========================================================
  // EXPORT CSV
  // =========================================================

  async function exportToCSV() {

    try {

      if (!navigator.onLine) {

        alert(
          "❌ Aucune connexion Internet."
        );

        return;

      }


      const response =
        await fetchWithTimeout(
          getScriptUrl()
        );


      if (!response.ok) {

        throw new Error(
          `Erreur HTTP ${response.status}`
        );

      }


      const logs =
        await response.json();


      if (logs.length === 0) {

        alert(
          "Aucune donnée à exporter."
        );

        return;

      }


      let csvContent =
        "\uFEFFDate;Heure;Collaborateur;Action\n";


      logs.forEach(l => {

        csvContent +=
          `${l.date};${l.time};${l.user};${l.action}\n`;

      });


      const blob =
        new Blob(
          [csvContent],
          {
            type: "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        `Pointages_Chataignier_${
          new Date()
            .toISOString()
            .slice(0, 10)
        }.csv`;


      document.body.appendChild(a);

      a.click();

      document.body.removeChild(a);


      URL.revokeObjectURL(url);


    } catch (error) {

      console.error(
        "Erreur lors de l'export CSV :",
        error
      );

      alert(
        "❌ Impossible de télécharger les pointages. Vérifiez votre connexion et réessayez."
      );

    }

  }


  // =========================================================
  // DÉMARRAGE
  // =========================================================

  startTimer();

  renderHistory();

</script>
